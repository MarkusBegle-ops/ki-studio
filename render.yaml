databases:
  - name: ki-studio-db
    databaseName: ki_studio
    user: ki_studio
    plan: free

services:

  # ── Backend API (Express) ─────────────────────────────────────────────────
  - type: web
    name: ki-studio-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ki-studio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: markus.begle@icloud.com

  # ── Frontend (React + Vite, Static Site) ──────────────────────────────────
  - type: web
    name: ki-studio-frontend
    runtime: static
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/ki-studio run build
    staticPublishPath: artifacts/ki-studio/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
